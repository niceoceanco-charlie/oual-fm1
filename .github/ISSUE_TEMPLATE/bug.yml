name: Bug
description: Something is broken (engine, tools, web pages, build)
labels: [bug, needs-info]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Browser / OS / firmware version (if relevant)
